<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Birthday Wish</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100svh; overflow: hidden;
    display: grid; place-items: center;
    color: #fff1fb; font-family: Georgia, "Times New Roman", serif;
    background: radial-gradient(ellipse at 50% 65%, #351044 0%, #170c2b 42%, #050611 100%);
  }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; }
  .scene {
    position: relative; z-index: 1; width: min(94vw, 520px);
    min-height: 90svh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 28px 18px;
  }
  .intro { opacity: 0; animation: appear 2.5s ease forwards; }
  h1 { font-size: clamp(2rem, 8vw, 3.4rem); font-weight: 400; margin: 0 0 10px; text-shadow: 0 0 22px #ff9be8; }
  .sub { color: #e7c5e8; font-size: 1rem; letter-spacing: .08em; }
  .stage {
    position: relative; width: 290px; height: 300px; margin-top: 18px;
    display: grid; place-items: end center;
  }
  .cake {
    position: absolute; bottom: 28px; width: 220px; height: 105px;
    opacity: 0; transform: translateY(35px) scale(.8);
    transition: opacity 1.2s ease, transform 1.2s cubic-bezier(.2,.8,.2,1);
    filter: drop-shadow(0 0 22px #ff83d4);
  }
  .cake.show { opacity: 1; transform: translateY(0) scale(1); }
  .plate { position:absolute; bottom: 20px; width:250px; height:17px; border-radius:50%; background:linear-gradient(#f8d8f0,#a95c9e); box-shadow:0 0 22px #ff8bdd; }
  .cake-top { position:absolute; top:0; left:10px; width:200px; height:35px; border-radius:50%; background:#ffd7ee; border:2px solid #fff0fa; }
  .cake-body { position:absolute; top:17px; left:10px; width:200px; height:80px; border-radius:0 0 22px 22px; background:linear-gradient(90deg,#c56ba9,#f5a9d7 48%,#b85c9e); }
  .icing { position:absolute; top:17px; left:10px; width:200px; height:28px; border-radius:50%; background:#fff0f8; }
  .drip { position:absolute; top:30px; width:13px; height:24px; border-radius:0 0 10px 10px; background:#fff0f8; }
  .d1{left:42px}.d2{left:91px;height:32px}.d3{right:43px;height:20px}
  .sprinkle { position:absolute; z-index:2; top:8px; left:45px; width:8px; height:3px; border-radius:4px; background:#ffcc55; transform:rotate(25deg); box-shadow:35px 8px #c77cff, 72px -2px #ff83c8, 105px 8px #ffcc55; }
  .candle-wrap { position:absolute; z-index:4; bottom:128px; opacity:0; transform:translateY(20px); transition:opacity 2s ease,transform 2s ease; }
  .candle-wrap.show { opacity:1; transform:translateY(0); }
  .candle { width:15px; height:72px; border-radius:5px 5px 2px 2px; background:repeating-linear-gradient(135deg,#fff0f8 0 7px,#e88acb 7px 13px); box-shadow:0 0 12px #ffb4e6; }
  .flame {
    position:absolute; left:2px; top:-29px; width:12px; height:25px;
    background:radial-gradient(ellipse at 50% 70%,#fffbd0 0 18%,#ffd45e 35%,#ff8b45 70%,transparent 72%);
    border-radius:60% 40% 55% 45%; transform-origin:50% 100%;
    animation:flicker .8s ease-in-out infinite alternate;
    filter:drop-shadow(0 0 10px #ffb84d);
  }
  .flame.off { animation:none; opacity:0; transform:scale(.2) translateY(10px); transition:all .35s ease; }
  .hint { min-height:48px; margin-top:8px; color:#f5d7ee; font-size:1rem; opacity:0; animation:appear 1.5s 2s forwards; }
  .wish { opacity:0; transform:translateY(15px); transition:all 1.5s ease; margin-top:8px; max-width:360px; }
  .wish.show { opacity:1; transform:translateY(0); }
  .wish h2 { font-size:clamp(1.5rem,6vw,2.2rem); font-weight:400; color:#ffc4e8; margin:0 0 12px; }
  .wish p { line-height:1.65; color:#f5dff0; margin:0; font-size:1rem; }
  .replay { margin-top:20px; border:1px solid #eaa8db; background:#ffffff12; color:#ffe8f7; padding:10px 20px; border-radius:30px; font:inherit; cursor:pointer; opacity:0; transition:opacity 1s; }
  .replay.show { opacity:1; }
  .replay:active { transform:scale(.97); }
  .glow { position:absolute; width:240px; height:180px; bottom:35px; border-radius:50%; background:#ff70cf; filter:blur(75px); opacity:.15; pointer-events:none; }
  @keyframes appear { to { opacity:1; } }
  @keyframes flicker { from { transform:rotate(-5deg) scale(.95); } to { transform:rotate(5deg) scale(1.08); } }
  @media (max-height:650px) { .stage{height:240px;margin-top:0}.cake{bottom:18px}.candle-wrap{bottom:115px}.scene{padding:10px} }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<main class="scene">
  <div class="intro">
    <h1>For someone special ✨</h1>
    <div class="sub">a little birthday surprise</div>
  </div>
  <div class="stage" aria-label="A birthday candle and cake">
    <div class="glow"></div>
    <div class="cake" id="cake">
      <div class="cake-body"></div><div class="cake-top"></div><div class="icing"></div>
      <div class="drip d1"></div><div class="drip d2"></div><div class="drip d3"></div>
      <div class="sprinkle"></div>
    </div>
    <div class="candle-wrap" id="candleWrap">
      <div class="flame" id="flame"></div>
      <div class="candle"></div>
    </div>
    <div class="plate"></div>
  </div>
  <div class="hint" id="hint">Make a wish, ubriii ko<br>then u pindot. 🕯️</div>
  <section class="wish" id="wish">
    <h2>Happy Birthday my babyyy. ♡</h2>
    <p>Wala na po akong masabi, basta po happy birthday HAHAHA ito lang po munang cake maibibigay ko sayo:(</p>
  </section>
  <button class="replay" id="replay">See it again ✨</button>
</main>
<script>
  // Twinkling stars in the background
  const canvas = document.getElementById('sky'), ctx = canvas.getContext('2d');
  let stars = [];
  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = innerWidth*dpr; canvas.height = innerHeight*dpr;
    canvas.style.width = innerWidth+'px'; canvas.style.height = innerHeight+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    stars = Array.from({length: Math.floor(innerWidth*innerHeight/1800)}, () => ({
      x:Math.random()*innerWidth, y:Math.random()*innerHeight,
      r:Math.random()*1.7+.3, a:Math.random()*.7+.2, s:Math.random()*.018+.004
    }));
  }
  function draw() {
    ctx.clearRect(0,0,innerWidth,innerHeight);
    for (const s of stars) {
      s.a += s.s; if(s.a>.95 || s.a<.15) s.s *= -1;
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,205,245,${s.a})`; ctx.shadowBlur=8; ctx.shadowColor='#f58bdc'; ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  resize(); draw(); addEventListener('resize',resize);

  const candleWrap=document.getElementById('candleWrap');
  const flame=document.getElementById('flame');
  const cake=document.getElementById('cake');
  const hint=document.getElementById('hint');
  const wish=document.getElementById('wish');
  const replay=document.getElementById('replay');
  let blown=false;

  // Let the candle appear slowly after the greeting.
  setTimeout(()=>candleWrap.classList.add('show'),1800);

  function blowOut(e) {
    if (blown) return;
    blown=true;
    flame.classList.add('off');
    hint.textContent='Your wish is on its way… ♡';
    // A soft smoke puff, followed by the cake reveal.
    const smoke=document.createElement('div');
    smoke.textContent='☁'; smoke.style.cssText='position:absolute;bottom:220px;font-size:30px;color:#f7dff2;opacity:.8;animation:smoke 1.5s forwards;pointer-events:none';
    candleWrap.appendChild(smoke);
    const style=document.createElement('style');
    style.textContent='@keyframes smoke{to{transform:translateY(-45px) scale(1.8);opacity:0}}';
    document.head.appendChild(style);
    setTimeout(()=>{ cake.classList.add('show'); hint.style.opacity='0'; },650);
    setTimeout(()=>{ wish.classList.add('show'); replay.classList.add('show'); },1450);
  }
  flame.addEventListener('click',blowOut);
  flame.addEventListener('touchstart',blowOut,{passive:true});
  // Also allow tapping the candle itself on touch screens.
  candleWrap.addEventListener('click',blowOut);

  replay.addEventListener('click',()=>{
    blown=false; flame.classList.remove('off'); cake.classList.remove('show');
    wish.classList.remove('show'); replay.classList.remove('show');
    hint.textContent='Make a wish, my love… then tap the little flame. 🕯️';
    hint.style.opacity='1'; candleWrap.classList.remove('show');
    setTimeout(()=>candleWrap.classList.add('show'),500);
  });
</script>
</body>
</html>
